config_tools:
  - application_code: Tagging
    tool_code: tagging.policy
    label: Tagging Policy
    description: Safe tag slug and normalization policy stored in tag_policy.yaml.
    form_class: App\Tagging\Form\Config\TaggingPolicyConfigFormType
    service_class: App\Tagging\Service\Config\TaggingPolicyConfigService
    required_permission: administration.config.update
    editable_fields:
      - maxLength
      - maxTagsPerEntity
      - lowercaseNormalize
      - collapseSpaces
      - stripSymbols
      - defaultLocale
      - allowedLocales
    sensitive_fields: []
    readable_files:
      - config/tag_policy.yaml
    writable_files:
      - config/tag_policy.yaml
    apply_strategy: component_yaml
    metadata:
      section: Configuration
      kind: policy
