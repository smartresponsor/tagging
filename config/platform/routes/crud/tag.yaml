# ---------------------------------------------------------------------------
# Cruding token grammar — TagEntity root registry
# ---------------------------------------------------------------------------
# This is the single route-map registry/protocol source for Tagging.
# Zero-controller driven. Every HTTP entrypoint is an
# App\Tagging\Service\Http\Tag\Tag*Service.
#
# No {ref}; explicit id/slug variants are retained.
# ---------------------------------------------------------------------------

# Root CRUD

tag.index:                        { path: /tag/index,                           service: App\Tagging\Service\Http\Tag\TagIndexService }
tag.show_id:                      { path: /tag/show/{id},                       service: App\Tagging\Service\Http\Tag\TagShowService, resolver: id }
tag.show_slug:                    { path: /tag/show/{slug},                     service: App\Tagging\Service\Http\Tag\TagShowService, resolver: slug }
tag.new:                          { path: /tag/new,                             service: App\Tagging\Service\Http\Tag\TagNewService }
tag.create:                       { path: /tag/create,                          type: App\Tagging\Form\Tag\TagCreateType,    service: App\Tagging\Service\Http\Tag\TagCreateService }
tag.edit_id:                      { path: /tag/edit/{id},                       service: App\Tagging\Service\Http\Tag\TagEditService, resolver: id }
tag.edit_slug:                    { path: /tag/edit/{slug},                     service: App\Tagging\Service\Http\Tag\TagEditService, resolver: slug }
tag.update_id:                    { path: /tag/update/{id},                     type: App\Tagging\Form\Tag\TagUpdateType,    service: App\Tagging\Service\Http\Tag\TagUpdateService, resolver: id }
tag.update_slug:                  { path: /tag/update/{slug},                   type: App\Tagging\Form\Tag\TagUpdateType,    service: App\Tagging\Service\Http\Tag\TagUpdateService, resolver: slug }
tag.delete_id:                    { path: /tag/delete/{id},                     type: App\Tagging\Form\Tag\TagDeleteType,    service: App\Tagging\Service\Http\Tag\TagDeleteService, resolver: id }
tag.delete_slug:                  { path: /tag/delete/{slug},                   type: App\Tagging\Form\Tag\TagDeleteType,    service: App\Tagging\Service\Http\Tag\TagDeleteService, resolver: slug }
tag.bulk:                         { path: /tag/bulk,                            type: App\Tagging\Form\Tag\TagBulkType,      service: App\Tagging\Service\Http\Tag\TagBulkService }
tag.import:                       { path: /tag/import,                          type: App\Tagging\Form\Tag\TagImportType,    service: App\Tagging\Service\Http\Tag\TagImportService }
tag.export:                       { path: /tag/export,                          type: App\Tagging\Form\Tag\TagExportType,    service: App\Tagging\Service\Http\Tag\TagExportService }
tag.archive_id:                   { path: /tag/archive/{id},                    type: App\Tagging\Form\Tag\TagArchiveType,   service: App\Tagging\Service\Http\Tag\TagArchiveService, resolver: id }
tag.archive_slug:                 { path: /tag/archive/{slug},                  type: App\Tagging\Form\Tag\TagArchiveType,   service: App\Tagging\Service\Http\Tag\TagArchiveService, resolver: slug }
tag.restore_id:                   { path: /tag/restore/{id},                    type: App\Tagging\Form\Tag\TagRestoreType,   service: App\Tagging\Service\Http\Tag\TagRestoreService, resolver: id }
tag.restore_slug:                 { path: /tag/restore/{slug},                  type: App\Tagging\Form\Tag\TagRestoreType,   service: App\Tagging\Service\Http\Tag\TagRestoreService, resolver: slug }
tag.duplicate_id:                 { path: /tag/duplicate/{id},                  type: App\Tagging\Form\Tag\TagDuplicateType, service: App\Tagging\Service\Http\Tag\TagDuplicateService, resolver: id }
tag.duplicate_slug:               { path: /tag/duplicate/{slug},                type: App\Tagging\Form\Tag\TagDuplicateType, service: App\Tagging\Service\Http\Tag\TagDuplicateService, resolver: slug }

# Assignment

tag.assignment.index:             { path: /tag/assignment/index,                type: App\Tagging\Form\Tag\TagAssignmentFilterType,   service: App\Tagging\Service\Http\Tag\TagAssignmentIndexService }
tag.assignment.assign:            { path: /tag/assignment/assign,               type: App\Tagging\Form\Tag\TagAssignmentAssignType,   service: App\Tagging\Service\Http\Tag\TagAssignmentAssignService }
tag.assignment.unassign:          { path: /tag/assignment/unassign,             type: App\Tagging\Form\Tag\TagAssignmentUnassignType, service: App\Tagging\Service\Http\Tag\TagAssignmentUnassignService }

# Discovery

tag.search:                       { path: /tag/search,                          type: App\Tagging\Form\Tag\TagSearchType,             service: App\Tagging\Service\Http\Tag\TagSearchService }
tag.suggest:                      { path: /tag/suggest,                         type: App\Tagging\Form\Tag\TagSuggestType,            service: App\Tagging\Service\Http\Tag\TagSuggestService }

# Semantic graph

tag.relation.index:               { path: /tag/relation/index,                  type: App\Tagging\Form\Tag\TagRelationFilterType,     service: App\Tagging\Service\Http\Tag\TagRelationIndexService }
tag.relation.create:              { path: /tag/relation/create,                 type: App\Tagging\Form\Tag\TagRelationCreateType,     service: App\Tagging\Service\Http\Tag\TagRelationCreateService }
tag.synonym.index:                { path: /tag/synonym/index,                   type: App\Tagging\Form\Tag\TagSynonymFilterType,      service: App\Tagging\Service\Http\Tag\TagSynonymIndexService }
tag.synonym.create:               { path: /tag/synonym/create,                  type: App\Tagging\Form\Tag\TagSynonymCreateType,      service: App\Tagging\Service\Http\Tag\TagSynonymCreateService }
tag.scheme.show_name:             { path: /tag/scheme/show/{name},              service: App\Tagging\Service\Http\Tag\TagSchemeShowService, resolver: name }

# Governance

tag.proposal.create:              { path: /tag/proposal/create,                 type: App\Tagging\Form\Tag\TagProposalCreateType,     service: App\Tagging\Service\Http\Tag\TagProposalCreateService }
tag.proposal.approve_id:          { path: /tag/proposal/approve/{id},           type: App\Tagging\Form\Tag\TagProposalApproveType,    service: App\Tagging\Service\Http\Tag\TagProposalApproveService, resolver: id }
tag.classification.index:         { path: /tag/classification/index,            type: App\Tagging\Form\Tag\TagClassificationFilterType, service: App\Tagging\Service\Http\Tag\TagClassificationIndexService }

# Operations

tag.status:                       { path: /tag/status,                          service: App\Tagging\Service\Http\Tag\TagStatusService }
tag.metrics:                      { path: /tag/metrics,                         service: App\Tagging\Service\Http\Tag\TagMetricsService }
tag.webhook.index:                { path: /tag/webhook/index,                   service: App\Tagging\Service\Http\Tag\TagWebhookIndexService }
tag.webhook.create:               { path: /tag/webhook/create,                  type: App\Tagging\Form\Tag\TagWebhookCreateType,      service: App\Tagging\Service\Http\Tag\TagWebhookCreateService }
