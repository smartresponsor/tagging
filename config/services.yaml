imports:
    - { resource: 'services/tag_infrastructure.yaml' }
    - { resource: 'services/cache.yaml' }
    - { resource: 'services/tag_read_model.yaml' }
    - { resource: 'services/tag_application.yaml' }
    - { resource: 'services/tag_http.yaml' }
    - { resource: 'services/tag_ops.yaml' }
    - { resource: 'services/tag_core.yaml' }
    - { resource: 'services/tag_services.yaml' }

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Tagging\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Data/Model/Tag/TagEntity.php'
            - '../src/Form/Config/TaggingPolicyConfigFormType.php'
            - '../src/RepositoryInterface/'
            - '../src/Repository/Data/Tag/TagEntityRepository.php'
            - '../src/Value/'
            - '../src/Service/Core/TagBulkService.php'
            - '../src/Tests/'

    App\Tagging\Service\Config\TaggingPolicyConfigService:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $applyService: '@App\Administering\Service\Config\AdministrationConfigApplyService'
            $fileWriter: '@App\Administering\Service\Config\AdministrationConfigFileWriterService'
        tags: ['administering.config_tool']
